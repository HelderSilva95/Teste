{% extends "base.html" %}
{% block title %}Iniciar Produção{% endblock %}
{% block content %}
<div class="container py-4">
    <h2><i class="bi bi-play-circle"></i> Iniciar Produção</h2>
    <div class="card mt-3">
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Ordem de Trabalho *</label>
                        <select class="form-select" name="work_order_id" required>
                            {% if selected_order %}<option value="{{ selected_order.id }}" selected>{{ selected_order.order_number }}</option>{% endif %}
                            {% for order in work_orders %}
                            <option value="{{ order.id }}">{{ order.order_number }} - {{ order.product_code }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Máquina *</label>
                        <select class="form-select" name="machine_id" required>
                            {% for machine in machines %}<option value="{{ machine.id }}">{{ machine.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Operador Principal *</label>
                        <select class="form-select" name="operator1_id" required>
                            <option value="{{ user.id }}" selected>{{ user.full_name }} (Eu)</option>
                            {% for op in operators %}<option value="{{ op.id }}">{{ op.full_name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Operador Secundário</label>
                        <select class="form-select" name="operator2_id">
                            <option value="">Nenhum</option>
                            {% for op in operators %}<option value="{{ op.id }}">{{ op.full_name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tempo de Setup (minutos)</label>
                        <input type="number" class="form-control" name="setup_time" min="0">
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Notas</label>
                        <textarea class="form-control" name="notes" rows="3"></textarea>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success"><i class="bi bi-play"></i> Iniciar</button>
                    <a href="/production" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
