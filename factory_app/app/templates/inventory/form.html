{% extends "base.html" %}
{% block title %}Novo Item Inventário{% endblock %}
{% block content %}
<div class="container py-4">
    <h2><i class="bi bi-plus-circle"></i> Novo Item de Inventário</h2>
    <div class="card mt-3">
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">QR Code *</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="qr_code_input" name="qr_code" placeholder="Escanear ou digitar" required>
                            <button type="button" class="btn btn-primary" id="scanQRButton">
                                <i class="bi bi-qr-code-scan"></i> Escanear
                            </button>
                        </div>
                        <!-- Scanner QR (escondido inicialmente) -->
                        <div id="qr-reader" style="display: none; margin-top: 10px; width: 100%;"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tipo de Material *</label>
                        <select class="form-select" name="material_type" required>
                            <option value="chapa">Chapa</option>
                            <option value="maciço">Maciço</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nome do Material *</label>
                        <input type="text" class="form-control" name="material_name" placeholder="Ex: Granito, Mármore" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Cor</label>
                        <input type="text" class="form-control" name="color">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Acabamento</label>
                        <input type="text" class="form-control" name="finish" placeholder="Ex: Polido">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Comprimento (cm)</label>
                        <input type="number" step="0.01" class="form-control" name="length">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Largura (cm)</label>
                        <input type="number" step="0.01" class="form-control" name="width">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Espessura (cm)</label>
                        <input type="number" step="0.01" class="form-control" name="thickness">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Quantidade *</label>
                        <input type="number" step="0.01" class="form-control" name="quantity" value="1" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Localização</label>
                        <input type="text" class="form-control" name="location" placeholder="Local no armazém">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fornecedor</label>
                        <input type="text" class="form-control" name="supplier">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Número de Lote</label>
                        <input type="text" class="form-control" name="batch_number">
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Notas</label>
                        <textarea class="form-control" name="notes" rows="3"></textarea>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Criar</button>
                    <a href="/inventory" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/qr-scanner.js"></script>
<script>
// Inicializar scanner QR para o input de QR code
document.addEventListener('DOMContentLoaded', function() {
    initSimpleScanner('scanQRButton', 'qr-reader', 'qr_code_input');
});
</script>
{% endblock %}
