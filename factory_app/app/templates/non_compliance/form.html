{% extends "base.html" %}
{% block title %}Nova Não-Conformidade{% endblock %}
{% block content %}
<div class="container py-4">
    <h2><i class="bi bi-exclamation-triangle"></i> Nova Não-Conformidade</h2>
    <div class="card mt-3">
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tipo *</label>
                        <select class="form-select" name="nc_type" required>
                            <option value="quality">Qualidade</option>
                            <option value="safety">Segurança</option>
                            <option value="process">Processo</option>
                            <option value="equipment">Equipamento</option>
                            <option value="material">Material</option>
                            <option value="other">Outro</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Severidade *</label>
                        <select class="form-select" name="severity" required>
                            <option value="low">Baixa</option>
                            <option value="medium">Média</option>
                            <option value="high">Alta</option>
                            <option value="critical">Crítica</option>
                        </select>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Título *</label>
                        <input type="text" class="form-control" name="title" required>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Descrição *</label>
                        <textarea class="form-control" name="description" rows="4" required></textarea>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Data/Hora Ocorrência *</label>
                        <input type="datetime-local" class="form-control" name="occurred_at" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Ordem de Trabalho</label>
                        <select class="form-select" name="work_order_id">
                            <option value="">Nenhuma</option>
                            {% for order in work_orders %}<option value="{{ order.id }}">{{ order.order_number }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Máquina</label>
                        <select class="form-select" name="machine_id">
                            <option value="">Nenhuma</option>
                            {% for machine in machines %}<option value="{{ machine.id }}">{{ machine.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Atribuir a</label>
                        <select class="form-select" name="assigned_to_id">
                            <option value="">Ninguém</option>
                            {% for u in users %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Custo Estimado (€)</label>
                        <input type="number" class="form-control" name="estimated_cost">
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning"><i class="bi bi-save"></i> Criar</button>
                    <a href="/non-compliance" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
