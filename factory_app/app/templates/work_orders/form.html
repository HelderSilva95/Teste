{% extends "base.html" %}
{% block title %}Nova Ordem de Trabalho{% endblock %}
{% block content %}
<div class="container py-4">
    <h2><i class="bi bi-plus-circle"></i> Nova Ordem de Trabalho</h2>
    <div class="card mt-3">
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Número da Ordem *</label>
                        <input type="text" class="form-control" name="order_number" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Código Produto *</label>
                        <input type="text" class="form-control" name="product_code" required>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Descrição Produto *</label>
                        <textarea class="form-control" name="product_description" rows="2" required></textarea>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Quantidade Planeada *</label>
                        <input type="number" step="0.01" class="form-control" name="quantity_planned" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Máquina *</label>
                        <select class="form-select" name="machine_id" required>
                            {% for machine in machines %}
                            <option value="{{ machine.id }}">{{ machine.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Prioridade (1-10) *</label>
                        <input type="number" class="form-control" name="priority" value="5" min="1" max="10" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Início Planeado</label>
                        <input type="datetime-local" class="form-control" name="planned_start">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fim Planeado</label>
                        <input type="datetime-local" class="form-control" name="planned_end">
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Notas</label>
                        <textarea class="form-control" name="notes" rows="3"></textarea>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Criar</button>
                    <a href="/work-orders" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
